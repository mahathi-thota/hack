// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

def localBuildRoot = new File(
    System.getenv('LOCALAPPDATA') ?: System.getProperty('java.io.tmpdir'),
    'SahaayAI/gradle-build'
)

allprojects {
    // Keep Gradle outputs outside OneDrive. OneDrive represents files it owns
    // as reparse points, and Gradle 8.11 cannot snapshot those build outputs.
    // Source assets remain in the project and are packaged as usual.
    buildDir = new File(localBuildRoot, project.path == ':' ? 'root' : project.path.substring(1).replace(':', '_'))

    repositories {
        google()
        mavenCentral()
    }

    // Android lint snapshots Capacitor's web assets directly from OneDrive;
    // those source files can be reparse points. This reporting task does not
    // need incremental changes, unlike Android resource packaging tasks.
    tasks.configureEach { task ->
        if (task.name.endsWith('LintVitalReportModel')) {
            task.doNotTrackState('OneDrive reparse points are not snapshotable by Gradle on Windows.')
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
